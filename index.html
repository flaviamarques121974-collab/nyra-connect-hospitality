const f=document.getElementById('deck');
f.addEventListener('load',()=>{
 const d=f.contentDocument,w=f.contentWindow;
 const st=d.createElement('style');
 st.textContent=`@media(max-width:760px){

}`;
 d.head.appendChild(st);
 let sx=0,sy=0,tm=0;
 d.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tm=Date.now()},{passive:true});
 d.addEventListener('touchend',e=>{if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Date.now()-tm<900&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25&&typeof w.go==='function')w.go(dx<0?1:-1)},{passive:true});
