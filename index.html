<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NYRA Connect Hospitality</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151d}
#deck{display:block;border:0;width:100%;height:100dvh}
.mobile-nav{display:none}
@media(max-width:760px){
 .mobile-nav{display:flex;position:fixed;z-index:99999;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));gap:8px}
 .mobile-nav button{width:44px;height:44px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(7,29,42,.9);color:#fff;font-size:25px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
}
</style>
</head>
<body>
<iframe id="deck" src="/deck.html" title="NYRA Connect Hospitality"></iframe>
<div class="mobile-nav"><button onclick="nav(-1)" aria-label="Anterior">‹</button><button onclick="nav(1)" aria-label="Próximo">›</button></div>
<script>
const frame=document.getElementById('deck');
function nav(n){try{frame.contentWindow.go(n)}catch(e){}}
frame.addEventListener('load',()=>{
 const d=frame.contentDocument,w=frame.contentWindow;
 const st=d.createElement('style');
 st.textContent=`
 @media(max-width:760px){
  html,body{width:100%!important;max-width:100%!important;height:100%!important;overflow:hidden!important}
  body{overscroll-behavior:none}
  .brand{position:fixed!important;top:18px!important;left:20px!important;font-size:9px!important;z-index:50!important}
  .count{position:fixed!important;top:18px!important;right:20px!important;font-size:9px!important;z-index:50!important}
  .slide{width:100%!important;height:100dvh!important;min-height:0!important;max-width:100vw!important;padding:64px 22px 92px!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;align-items:flex-start!important}
  .slide.active{display:flex!important}
  .slide>div:not(.phone-ui):not(.tablet-ui){max-width:100%!important}
  h1,h2{overflow-wrap:anywhere}
  .hero{background-position:center!important;align-items:center!important}
  .hero h1{font-size:clamp(38px,12vw,58px)!important;line-height:.98!important;max-width:100%!important}
  .hero p,.lead{font-size:15px!important;line-height:1.55!important;max-width:100%!important}
  h2{font-size:clamp(31px,9vw,44px)!important;line-height:1.04!important}
  .eyebrow{font-size:10px!important;line-height:1.4!important}
  .grid{grid-template-columns:1fr!important;gap:12px!important;width:100%!important}
  .card{min-height:0!important;padding:18px!important}
  .split{display:block!important;width:100%!important}
  .split>div{width:100%!important;max-width:100%!important}
  .split .photo{position:relative!important;width:100%!important;height:260px!important;margin-top:22px!important}
  .window{display:block!important;width:100%!important;height:auto!important;min-height:0!important;margin-top:20px!important;overflow:hidden!important}
  .window .side{display:none!important}
  .window .main{width:100%!important;padding:18px!important}
  .window .profile{width:100%!important;padding:18px!important;border-left:0!important;border-top:1px solid rgba(20,48,58,.15)!important}
  .conversation{max-width:100%!important}
  .bubble{max-width:94%!important;font-size:12px!important}
  .reference-capture.active{display:block!important}
  .alert-visual,.agent-visual{padding-top:70px!important;background-position:center!important}
  .alert-copy,.agent-copy{width:100%!important;max-width:100%!important}
  .alert-copy h2,.agent-copy h2{font-size:clamp(32px,9vw,42px)!important}
  .phone-ui{position:relative!important;right:auto!important;bottom:auto!important;transform:none!important;width:min(286px,88vw)!important;height:570px!important;margin:26px auto 10px!important}
  .agent-chat{width:100%!important}
  .tablet-ui{position:relative!important;right:auto!important;bottom:auto!important;transform:none!important;width:100%!important;height:auto!important;min-height:460px!important;margin:26px auto 10px!important}
  .close{align-items:center!important;text-align:center!important}
  .close h2{font-size:clamp(38px,11vw,52px)!important}
  .legal-footer{position:fixed!important;left:20px!important;right:105px!important;bottom:18px!important;font-size:7px!important;z-index:40!important}
  .nav{display:none!important}
 }
 `;
 d.head.appendChild(st);
 let x=0,y=0,t=0;
 d.addEventListener('touchstart',e=>{const q=e.changedTouches[0];x=q.clientX;y=q.clientY;t=Date.now()},{passive:true});
 d.addEventListener('touchend',e=>{const q=e.changedTouches[0],dx=q.clientX-x,dy=q.clientY-y;if(Date.now()-t<700&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){w.go(dx<0?1:-1)}},{passive:true});
});
</script>
</body></html>
